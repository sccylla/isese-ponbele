name: Check crawlable content

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run seo:check
      - run: npm test
