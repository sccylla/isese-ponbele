name: Finalize sharp product images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enhance-product-images.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight image tooling
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Restore original package photos
        run: |
          git show ea0d526bca0b75e58526ce4ee2ec75d84c514220:data.js > /tmp/data-original.js

      - name: Blend restored detail with original packaging
        run: |
          python - <<'PY'
          import base64, io, re
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter

          root = Path('.')
          source_text = Path('/tmp/data-original.js').read_text(encoding='utf-8')
          out_dir = root / 'assets' / 'products'
          marker = 'image:"data:image/webp;base64,'

          products = [
              ('Infection Crusher', 'infection-crusher-ai-v3.webp', 'infection-crusher-final-v4.webp'),
              ('Gorilla Max', 'gorilla-max-ai-v3.webp', 'gorilla-max-final-v4.webp'),
              ('IP Pile Elixir Combo (Agbo + Agunmu)', 'pile-elixir-combo-ai-v3.webp', 'pile-elixir-combo-final-v4.webp'),
          ]

          for name, ai_name, final_name in products:
              start = source_text.find(f'name:"{name}"')
              if start < 0:
                  raise RuntimeError(f'Product not found: {name}')
              p = source_text.find(marker, start)
              b = p + len(marker)
              e = source_text.find('"', b)
              raw = base64.b64decode(source_text[b:e])

              original = Image.open(io.BytesIO(raw)).convert('RGB')
              ai = Image.open(out_dir / ai_name).convert('RGB')

              # Scale original cleanly, then mix it into the AI reconstruction.
              # This keeps real label geometry/text while retaining recovered edges.
              original_up = original.resize(ai.size, Image.Resampling.LANCZOS)
              mixed = Image.blend(original_up, ai, 0.54)
              mixed = ImageEnhance.Contrast(mixed).enhance(1.045)
              mixed = ImageEnhance.Color(mixed).enhance(1.025)
              mixed = mixed.filter(ImageFilter.UnsharpMask(radius=0.7, percent=92, threshold=2))
              mixed = ImageEnhance.Sharpness(mixed).enhance(1.08)

              dest = out_dir / final_name
              mixed.save(dest, 'WEBP', quality=98, method=6)
              print(name, original.size, ai.size, dest.stat().st_size)

          data_path = root / 'data.js'
          data = data_path.read_text(encoding='utf-8')
          data = re.sub(r'assets/products/infection-crusher-[^"\']+\.webp','assets/products/infection-crusher-final-v4.webp',data)
          data = re.sub(r'assets/products/gorilla-max-[^"\']+\.webp','assets/products/gorilla-max-final-v4.webp',data)
          data = re.sub(r'assets/products/pile-elixir-combo-[^"\']+\.webp','assets/products/pile-elixir-combo-final-v4.webp',data)
          data_path.write_text(data,encoding='utf-8')

          for page in ('index.html','store.html'):
              p = root / page
              html = p.read_text(encoding='utf-8')
              html = re.sub(r'data\.js(?:\?v=[^"\']*)?','data.js?v=20261008-final-products-v4',html)
              p.write_text(html,encoding='utf-8')
          PY

      - name: Commit final product images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js index.html store.html assets/products/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Finalize sharp product images with label-preserving blend"
            git push
          fi
