name: Rebuild product images with Real-ESRGAN v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enhance-product-images.yml'

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore original 320x240 product sources
        run: |
          git show ea0d526bca0b75e58526ce4ee2ec75d84c514220:data.js > /tmp/data-original.js

      - name: Install compatible Real-ESRGAN stack
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy<2"
          pip install basicsr==1.4.2 facexlib==0.3.0 gfpgan==1.3.8 realesrgan==0.3.0
          pip install pillow opencv-python-headless

      - name: Download Real-ESRGAN x4plus model
        run: |
          curl -L --retry 3 --fail \
            https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth \
            -o /tmp/RealESRGAN_x4plus.pth

      - name: Extract originals
        run: |
          python - <<'PY'
          import base64, io
          from pathlib import Path
          from PIL import Image

          text = Path('/tmp/data-original.js').read_text(encoding='utf-8')
          out = Path('/tmp/product-src')
          out.mkdir(parents=True, exist_ok=True)

          products = [
              ('Infection Crusher', 'infection-crusher.png'),
              ('Gorilla Max', 'gorilla-max.png'),
              ('IP Pile Elixir Combo (Agbo + Agunmu)', 'pile-elixir-combo.png'),
          ]
          marker = 'image:"data:image/webp;base64,'

          for name, filename in products:
              start = text.find(f'name:"{name}"')
              if start < 0:
                  raise RuntimeError(f'Product not found: {name}')
              p = text.find(marker, start)
              if p < 0:
                  raise RuntimeError(f'Image not found: {name}')
              b = p + len(marker)
              e = text.find('"', b)
              raw = base64.b64decode(text[b:e])
              im = Image.open(io.BytesIO(raw)).convert('RGB')
              im.save(out / filename, 'PNG')
              print(name, im.size)
          PY

      - name: Run Real-ESRGAN on original product photos
        run: |
          git clone --depth 1 https://github.com/xinntao/Real-ESRGAN.git /tmp/realesrgan-repo
          mkdir -p /tmp/realesrgan-repo/weights
          cp /tmp/RealESRGAN_x4plus.pth /tmp/realesrgan-repo/weights/RealESRGAN_x4plus.pth
          cd /tmp/realesrgan-repo
          python inference_realesrgan.py \
            -n RealESRGAN_x4plus \
            -i /tmp/product-src \
            -o /tmp/product-ai \
            --outscale 4 \
            --tile 192 \
            --tile_pad 16 \
            --fp32 \
            --suffix restored \
            --ext png

      - name: Finish restored images and wire them into site
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import cv2
          import numpy as np
          from PIL import Image, ImageEnhance, ImageFilter

          root = Path('.')
          output = root / 'assets' / 'products'
          output.mkdir(parents=True, exist_ok=True)

          items = [
              ('infection-crusher_restored.png', 'infection-crusher-ai-v3.webp'),
              ('gorilla-max_restored.png', 'gorilla-max-ai-v3.webp'),
              ('pile-elixir-combo_restored.png', 'pile-elixir-combo-ai-v3.webp'),
          ]

          for srcname, destname in items:
              src = Path('/tmp/product-ai') / srcname
              im = Image.open(src).convert('RGB')

              # Controlled label/detail finishing after generative SR.
              arr = cv2.cvtColor(np.array(im), cv2.COLOR_RGB2BGR)
              blur = cv2.GaussianBlur(arr, (0,0), 0.72)
              arr = cv2.addWeighted(arr, 1.18, blur, -0.18, 0)
              rgb = cv2.cvtColor(arr, cv2.COLOR_BGR2RGB)

              im = Image.fromarray(rgb)
              im = ImageEnhance.Contrast(im).enhance(1.04)
              im = ImageEnhance.Color(im).enhance(1.025)
              im = ImageEnhance.Sharpness(im).enhance(1.10)
              im = im.filter(ImageFilter.UnsharpMask(radius=0.45, percent=58, threshold=2))

              dest = output / destname
              im.save(dest, 'WEBP', quality=98, method=6)
              print(destname, im.size, dest.stat().st_size)

          data_path = root / 'data.js'
          data = data_path.read_text(encoding='utf-8')

          # Replace whichever prior generated set is currently referenced.
          patterns = {
              'infection-crusher': 'assets/products/infection-crusher-ai-v3.webp',
              'gorilla-max': 'assets/products/gorilla-max-ai-v3.webp',
              'pile-elixir-combo': 'assets/products/pile-elixir-combo-ai-v3.webp',
          }
          data = re.sub(r'assets/products/infection-crusher-[^"\']+\.webp', patterns['infection-crusher'], data)
          data = re.sub(r'assets/products/gorilla-max-[^"\']+\.webp', patterns['gorilla-max'], data)
          data = re.sub(r'assets/products/pile-elixir-combo-[^"\']+\.webp', patterns['pile-elixir-combo'], data)
          data_path.write_text(data, encoding='utf-8')

          for page in ('index.html','store.html'):
              p = root / page
              html = p.read_text(encoding='utf-8')
              html = re.sub(r'data\.js(?:\?v=[^"\']*)?', 'data.js?v=20261008-ai-restored-v3', html)
              p.write_text(html, encoding='utf-8')
          PY

      - name: Commit restored product images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js index.html store.html assets/products/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Restore product photos with Real-ESRGAN"
            git push
          fi
