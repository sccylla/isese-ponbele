name: Rebuild product images with Real-ESRGAN

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enhance-product-images.yml'

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore original embedded product photos from history
        run: |
          git show ea0d526bca0b75e58526ce4ee2ec75d84c514220:data.js > /tmp/data-original.js

      - name: Install Real-ESRGAN
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.1.2" "torchvision==0.16.2" --index-url https://download.pytorch.org/whl/cpu
          pip install basicsr==1.4.2 facexlib==0.3.0 gfpgan==1.3.8
          pip install git+https://github.com/xinntao/Real-ESRGAN.git
          pip install pillow numpy opencv-python-headless

      - name: Download Real-ESRGAN weights
        run: |
          mkdir -p /tmp/realesrgan
          curl -L --retry 3 --fail             https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/RealESRGAN_x4plus.pth             -o /tmp/realesrgan/RealESRGAN_x4plus.pth

      - name: Extract originals and rebuild sharper product images
        run: |
          python - <<'PY'
          import base64, io, re
          from pathlib import Path
          from PIL import Image

          text = Path('/tmp/data-original.js').read_text(encoding='utf-8')
          out = Path('/tmp/product-originals')
          out.mkdir(parents=True, exist_ok=True)

          products = [
              ('Infection Crusher', 'infection-crusher.png'),
              ('Gorilla Max', 'gorilla-max.png'),
              ('IP Pile Elixir Combo (Agbo + Agunmu)', 'pile-elixir-combo.png'),
          ]

          marker = 'image:"data:image/webp;base64,'
          for name, filename in products:
              start = text.find(f'name:"{name}"')
              if start < 0:
                  raise RuntimeError(f'Product not found: {name}')
              img_start = text.find(marker, start)
              if img_start < 0:
                  raise RuntimeError(f'Embedded image not found for {name}')
              b64_start = img_start + len(marker)
              b64_end = text.find('"', b64_start)
              raw = base64.b64decode(text[b64_start:b64_end])
              image = Image.open(io.BytesIO(raw)).convert('RGB')
              image.save(out / filename, 'PNG')
              print(name, image.size)
          PY

          git clone --depth 1 https://github.com/xinntao/Real-ESRGAN.git /tmp/Real-ESRGAN
          mkdir -p /tmp/realesrgan-out
          cd /tmp/Real-ESRGAN
          python inference_realesrgan.py             -n RealESRGAN_x4plus             -i /tmp/product-originals             -o /tmp/realesrgan-out             --model_path /tmp/realesrgan/RealESRGAN_x4plus.pth             --outscale 4             --tile 160             --tile_pad 12             --fp32             --suffix sharp             --ext png

      - name: Finish, sharpen and save web assets
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter

          root = Path('.')
          out_dir = root / 'assets' / 'products'
          out_dir.mkdir(parents=True, exist_ok=True)

          items = [
              ('infection-crusher_sharp.png', 'infection-crusher-ultra-v2.webp'),
              ('gorilla-max_sharp.png', 'gorilla-max-ultra-v2.webp'),
              ('pile-elixir-combo_sharp.png', 'pile-elixir-combo-ultra-v2.webp'),
          ]

          for src_name, dest_name in items:
              src = Path('/tmp/realesrgan-out') / src_name
              im = Image.open(src).convert('RGB')

              # Controlled finishing: local crispness without changing packaging geometry.
              im = ImageEnhance.Contrast(im).enhance(1.035)
              im = ImageEnhance.Color(im).enhance(1.035)
              im = ImageEnhance.Sharpness(im).enhance(1.18)
              im = im.filter(ImageFilter.UnsharpMask(radius=0.55, percent=70, threshold=2))

              dest = out_dir / dest_name
              im.save(dest, 'WEBP', quality=98, method=6)
              print(dest_name, im.size, dest.stat().st_size)

          data = (root / 'data.js').read_text(encoding='utf-8')
          replacements = {
              'assets/products/infection-crusher-hq.webp': 'assets/products/infection-crusher-ultra-v2.webp',
              'assets/products/gorilla-max-hq.webp': 'assets/products/gorilla-max-ultra-v2.webp',
              'assets/products/pile-elixir-combo-hq.webp': 'assets/products/pile-elixir-combo-ultra-v2.webp',
          }
          for old, new in replacements.items():
              data = data.replace(old, new)
          (root / 'data.js').write_text(data, encoding='utf-8')

          for page in ('index.html', 'store.html'):
              p = root / page
              html = p.read_text(encoding='utf-8')
              html = re.sub(r'data\.js(?:\?v=[^"\']*)?', 'data.js?v=20261008-realesrgan-v2', html)
              p.write_text(html, encoding='utf-8')
          PY

      - name: Commit ultra-sharp product images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js index.html store.html assets/products/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Rebuild product images with Real-ESRGAN"
            git push
          fi
