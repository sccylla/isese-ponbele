name: Build MotionForge APK

on:
  push:
    branches: [motionforge-apk-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode Android project
        run: |
          mkdir -p motionforge-android-build
          cat motionforge-build/chunk*.b64 | base64 -d > /tmp/motionforge-project.tar.gz
          tar -xzf /tmp/motionforge-project.tar.gz -C motionforge-android-build
      - name: Build installable debug APK
        working-directory: motionforge-android-build
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp motionforge-android-build/app/build/outputs/apk/debug/app-debug.apk MotionForge-AI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MotionForge-AI-APK
          path: MotionForge-AI.apk
          retention-days: 7
