name: Build Digital Opele APK
on:
  workflow_dispatch:
  push:
    branches: [digital-opele]
    paths:
      - 'opele/**'
      - 'opele-android/**'
      - '.github/scripts/generate_opele_knowledge.py'
      - '.github/workflows/digital-opele-apk.yml'
permissions: { contents: read }
jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle consultation web app
        run: |
          rm -rf opele-android/app/src/main/assets
          mkdir -p opele-android/app/src/main/assets
          cp -R opele/. opele-android/app/src/main/assets/
      - name: Generate expanded offline interpretation pack
        run: |
          python .github/scripts/generate_opele_knowledge.py opele-android/app/src/main/assets/knowledge.generated.js
          ls -lh opele-android/app/src/main/assets/knowledge.generated.js
          test $(stat -c%s opele-android/app/src/main/assets/knowledge.generated.js) -gt 10000000
      - name: Build clean APK
        working-directory: opele-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify Android package and launcher
        run: |
          APK="opele-android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.iseseponbele.digitalopele'" /tmp/badging.txt
          grep -q "versionName='3.0.0'" /tmp/badging.txt
          grep -q "launchable-activity" /tmp/badging.txt
          grep -q "application-icon" /tmp/badging.txt
          unzip -t "$APK"
          cp "$APK" Digital-Opele-Ifa-v3.apk
          ls -lh Digital-Opele-Ifa-v3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: digital-opele-ifa-v3-apk
          path: Digital-Opele-Ifa-v3.apk
          if-no-files-found: error
          retention-days: 90
