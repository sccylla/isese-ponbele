name: Build MotionForge Free APK
on:
  push:
    branches: [motionforge-free-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode project
        run: |
          mkdir -p motionforge-free-android
          cat motionforge-free-build/chunk*.b64 | base64 -d > /tmp/motionforge-free.tar.gz
          tar -xzf /tmp/motionforge-free.tar.gz -C motionforge-free-android
      - name: Build APK
        working-directory: motionforge-free-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp motionforge-free-android/app/build/outputs/apk/debug/app-debug.apk MotionForge-Free.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MotionForge-Free-APK
          path: MotionForge-Free.apk
          retention-days: 7
