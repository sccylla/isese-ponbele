name: Build Isese Ponbele APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-isese-apk.yml'
      - '*.css'
      - '*.js'
      - '*.html'
      - 'assets/**'
      - 'favicon.svg'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle complete website inside Android app
        shell: bash
        run: |
          rm -rf android-app/app/src/main/assets/www
          mkdir -p android-app/app/src/main/assets/www
          for item in *; do
            if [ "$item" = "android-app" ]; then
              continue
            fi
            if [ -f "$item" ]; then
              cp "$item" android-app/app/src/main/assets/www/
            elif [ -d "$item" ]; then
              cp -R "$item" android-app/app/src/main/assets/www/
            fi
          done
          echo "Bundled website size:"
          du -sh android-app/app/src/main/assets/www
          echo "Bundled files:"
          find android-app/app/src/main/assets/www -type f | wc -l

      - name: Keep branded loader visible in Android app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android-app/app/src/main/java/com/iseseponbele/app/MainActivity.java')
          s = p.read_text()
          s = s.replace('.site-header,.top-ticker,.site-loader,.scroll-progress,.cursor-dot,.cursor-ring{display:none!important;}', '.site-header,.top-ticker,.scroll-progress,.cursor-dot,.cursor-ring{display:none!important;}')
          p.write_text(s)
          PY

      - name: Apply exact gold app branding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          logo_b64 = ''''''
          out = Path('android-app/app/src/main/res/drawable/isese_brand_logo.webp')
          out.write_bytes(base64.b64decode(logo_b64))

          manifest = Path('android-app/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          m = m.replace('@drawable/ic_launcher', '@drawable/isese_brand_logo')
          manifest.write_text(m)

          layout = Path('android-app/app/src/main/res/layout/activity_main.xml')
          x = layout.read_text()
          x = x.replace('android:background="@drawable/logo_circle"', 'android:background="@drawable/isese_brand_logo"')
          x = x.replace('android:text="IP"', 'android:text=""')
          x = x.replace('android:visibility="gone">\n\n        <View\n            android:id="@+id/ringOuter"', '>\n\n        <View\n            android:id="@+id/ringOuter"')
          layout.write_text(x)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build full installable APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug

      - name: Verify APK package
        shell: bash
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging "$APK" | head -20
          ls -lh "$APK"
          cp "$APK" Isese-Ponbele-2.1-Gold-Logo.apk

      - name: Upload full Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Isese-Ponbele-Android-2.1-Gold-Logo
          path: Isese-Ponbele-2.1-Gold-Logo.apk
          if-no-files-found: error
          retention-days: 90
